# Autenticación básica para el despliegue público.
#
# Se monta sobre /etc/nginx/auth-included.conf, que en la imagen está vacío
# (ver Frontend/Dockerfile). Al estar incluido en el contexto `server`, aplica a
# TODO: la app, /api, /api-baseline y /api/media/... — que es lo que se quiere,
# porque por /media se descargan los PDF de los manuales.
#
# El archivo .htpasswd lo genera deploy/provision.sh con `openssl passwd -apr1`.
#
# Ojo con el alcance de esto: sin HTTPS, la contraseña viaja en claro. Alcanza
# para una demo entre gente conocida y para que un bot que escanee puertos no te
# gaste la cuota de OpenAI, pero no es una medida de seguridad seria.
auth_basic "Asistente Tecnico - acceso restringido";
auth_basic_user_file /etc/nginx/.htpasswd;
