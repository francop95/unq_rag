# nginx sirve el bundle estático y hace de proxy inverso a las dos APIs.
#
# Por qué proxy y no llamadas directas del navegador a :5000 / :5001:
#
#   - Desaparece el CORS. Todo sale del mismo origen, así que no hay que
#     mantener CORS_ALLOWED_ORIGIN ni preocuparse por el preflight.
#   - El bundle queda con rutas relativas (/api, /api-baseline), así que la
#     misma imagen sirve en localhost, en la red de planta o detrás de un
#     dominio, sin reconstruir. Vite inyecta las VITE_* en tiempo de build: si
#     fueran URLs absolutas, cambiar de host obligaría a rebuildear.
#   - Los nombres `api` y `api-baseline` los resuelve el DNS interno de compose.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker, con TTL corto.
    #
    # Hace falta porque nginx resuelve los nombres de `proxy_pass` UNA VEZ, al
    # cargar la configuración, y cachea la IP para siempre. Medido: después de
    # un `docker compose up -d --force-recreate api api-baseline` los dos
    # contenedores intercambiaron IP, nginx siguió apuntando a la vieja y todo
    # respondía 502 "connection refused" hasta reiniciar nginx.
    #
    # Con un resolver y el upstream en una variable, nginx vuelve a resolver
    # cada 10 s y un restart de las APIs deja de romper el proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras que ya ponía la API por su cuenta; acá aplican a todo el sitio.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Punto de extensión para la autenticación.
    #
    # La imagen trae este archivo VACÍO, así que en local no pide contraseña. El
    # deploy monta encima deploy/auth.conf, que activa basic auth para todo el
    # server —la app, /api y /api-baseline— sin tocar esta configuración ni
    # duplicarla en un nginx.prod.conf que después se desincroniza.
    include /etc/nginx/auth-included.conf;

    # --- API multimodal ---
    location /api/ {
        # El upstream va en una variable para forzar la re-resolución (ver el
        # resolver de arriba). Con una variable, nginx ya no recorta el prefijo
        # de la location solo, así que el rewrite lo hace explícito:
        # /api/get_response -> /get_response
        set $api_backend "api:5000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Una consulta que llama a OpenAI y adjunta los planos tarda bastante.
        # Con el default de 60s, nginx cortaba con 504 antes de que respondiera.
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Las respuestas se arman de una sola vez; el buffering no aporta nada
        # y solo agrega latencia al primer byte.
        proxy_buffering off;

        client_max_body_size 20m;
    }

    # --- API línea base (solo texto + OCR) ---
    location /api-baseline/ {
        set $baseline_backend "api-baseline:5001";
        rewrite ^/api-baseline/(.*)$ /$1 break;
        proxy_pass http://$baseline_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;

        client_max_body_size 20m;
    }

    # Assets con hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea, así que un deploy nuevo se ve al recargar.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
